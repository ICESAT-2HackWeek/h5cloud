# Key variables in IceSat-2 Level 2A and 3A Products
products:
  - dataset: alt03
    name: ATLAS/ICESat-2 L2A Global Geolocated Photon Data
    variable: /gtx/heights/h_ph
    long_name: photon wgs84 height
  - dataset: atl04
    name: ATLAS/ICESat-2 L2A Normalized Relative Backscatter Profiles
    variable: /profile_x/nrb_profile
    long_name: normalized relative backscatter profile 
  - dataset: atl06
    name: ATLAS/ICESat-2 L3A Land Ice Height
    variable: /gtx/land_ice_segments/h_li 
    long_name: land ice height 
  - dataset: atl07
    name: ATLAS/ICESat-2 L3A Sea Ice Height
    variable:  /gtx/sea_ice_segments/heights/height_segment_height
    long_name: height of segment surface 
  - dataset: atl08
    name: ATLAS/ICESat-2 L3A Land and Vegetation Height
    variable: /gtx/land_segments/canopy/h_canopy
    long_name: height canopy
    reference: https://doi.org/10.1016/j.rse.2018.11.005
  - dataset: atl09
    name: ATLAS/ICESat-2 L3A Calibrated Backscatter Profiles and Atmospheric Layer Characteristics
    variable: /profile_x/high_rate/cab_prof
    long_name: calibrated attenuated backscatter
  - dataset: atl10
    name: ATLAS/ICESat-2 L3A Sea Ice Freeboard
    variable: /gtx/freeboard_segment/heights/height_segment_height
    long_name: height of segment surface
  - dataset: atl11
    name: ATLAS/ICESat-2 L3B Slope-Corrected Land Ice Height Time Series
    variable: /ptX/h_corr
    long_name: mean corrected height
  - dataset: atl12
    name: ATLAS/ICESat-2 L3A Ocean Surface Height
    variable: /gtx/ssh_segments/heights/h
    long_name: mean sea surface height
  - dataset: atl13
    name: ATLAS/ICESat-2 L3A Along Track Inland Surface Water Data
    variable: /gtx/ht_water_surf
    long_name: Water surface height
